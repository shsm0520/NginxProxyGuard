# HTTPS server (handles both HTTP->HTTPS redirect and HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Backup restore uploads the whole archive to /api/v1/backups/upload-restore.
    # nginx's 1m default rejected every archive above ~1 MiB with a bare 413 before
    # the API ever saw it (#303); 100m matches the proxy container's own limit.
    client_max_body_size 100m;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Handle plain HTTP requests sent to HTTPS port (redirect to HTTPS)
    # Note: Don't include port - browser will keep the original port (81)
    error_page 497 =301 https://$host$request_uri;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # SPA routing - index.html should never be cached to ensure users get latest version
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching of index.html to ensure users always get the latest version after upgrades
    location = /index.html {
        # Security headers (nginx doesn't inherit when add_header is used in location)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

        # Cache control
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # API proxy
    location /api {
        # These four are deliberately repeated, and Content-Security-Policy is
        # deliberately absent. nginx's rule is all-or-nothing: a single add_header
        # anywhere in this location cancels EVERY add_header inherited from the
        # server block. Dropping the server CSP here is the point — the UI policy
        # (script-src 'self') intersected with the API's own CSP and blocked the
        # CDN that /api/docs loads swagger-ui from, leaving a blank page (#296).
        # The API sends its own CSP, so /api responses stay covered. But the same
        # rule means deleting any one line below silently strips all four headers
        # from every /api response — they must stay listed by hand.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $host drops the port, so a panel reached on :81 would have the API
        # believe it lives on :443. That is invisible almost everywhere, but the
        # OIDC redirect_uri is built from it and must match the identity provider
        # byte for byte — $http_host keeps the port. (#227)
        proxy_set_header X-Forwarded-Host $http_host;

        # Longer timeouts for heavy API operations (config sync, SSL issuance, backup)
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    location /health {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        # nginx's add_header rule is all-or-nothing per context: the moment ONE
        # add_header appears in a location, EVERY add_header inherited from the
        # server block is discarded. The Cache-Control below used to be that one
        # line, so every .js and .css the panel serves went out with none of the
        # five security headers — notably no X-Content-Type-Options: nosniff.
        # They are repeated here by hand for that reason. Same trap, same file:
        # see the note in `location /api` (#296), where dropping the server CSP
        # is the deliberate half. Here nothing is meant to be dropped, so these
        # five must stay byte-identical to the server block above — the assets
        # are same-origin static files, so the panel's policy is the right one.
        # Anyone adding an add_header to a new location owes it the same list.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
